<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>

    <style>
        
 
        /* Container kuu ya input */
.input-container {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #f0f2f5;
    padding: 15px;
    display: flex;
    gap: 10px;
    box-sizing: border-box; /* Inazuia input kutoka nje ya screen */
    border-top: 1px solid #ccc;
}
   /* Kodi hii itafanya kazi kwenye vioo vidogo chini ya pixel 768 (Simu) */
@media screen and (max-width: 768px) {}
@media print {
body { display: none !important; }
}

/* Input ya maandishi */
#admin-message {
    flex: 1; /* Inachukua nafasi yote iliyobaki */
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 20px; /* Muonekano wa kisasa wa WhatsApp */
    outline: none;
    font-size: 16px; /* Hii inazuia zoom kwenye simu (iOS/Android) */
}

/* Button ya kutuma */
button {
    padding: 10px 20px;
    background-color: #075e54;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}
        body { margin: 0; font-family: "Times New Roman", serif; background-color: #e5ddd5; }
       
        .admin-bubble { background: #dcf8c6; margin-left: auto; text-align: right; } /* Kijani (Admin) */
.client-bubble { background: #ffffff; margin-right: auto; text-align: left; }  /* Nyeupe (Mteja) */
.message { padding: 10px; border-radius: 10px; margin: 5px; max-width: 70%; 
}
#Charts {
    display: flex;
    flex-direction: column; /* Hii inafanya meseji zipangike juu kwa juu */
    justify-content: flex-end; /* Hii inasukuma meseji kuanzia chini */
    padding: 10px;
    height: 80vh; /* Hakikisha container inachukua nafasi kubwa */
    overflow-y: auto;
}

.message-bubble {
    background-color: #dcf8c6; /* Rangi ya bubble ya mtumaji */
    padding: 10px 15px;
    border-radius: 20px;
    margin: 5px;
    max-width: 70%;
    align-self: flex-end; /* Hii inapeleka bubble upande wa kulia */
    font-family: sans-serif;
}

    /* Watermark CSS Iliyorekebishwa */
    .chat-container::before {
        content: "";
        position: fixed; /* Hii ni muhimu ili watermark isishuke chini */
        top: 50%;
        left: 50%;
        width: 900px; /* Badilisha ukubwa kulingana na picha yako */
        height: 900px; /* Badilisha ukubwa kulingana na picha yako */
        /* Weka link ya picha yako hapa */
        background-image: url('background.jpg'); /* Hii inapaswa kuwa picha ya watermark yako */
        background-repeat: no-repeat; /* Hii inazuia picha isijirudie */
        background-size: contain;
        transform: translate(-50%, -50%); /* Hii ndiyo siri ya kuikaisha kati */
        opacity: 0.2; /* Picha itafifia kama watermark */       
        pointer-events: none; /* Inaruhusu kubofya vitu vilivyo juu */
        z-index: -1; /* Inahakikisha inakaa nyuma ya ujumbe */
    }
        /* Muundo wa Bubble */
        .message { padding: 10px; margin: 10px; border-radius: 20px; background: rgb(241, 238, 238); max-width: 50%; position: relative; z-index: 1; }
        .sender { font-weight: bold; color: #075e54; font-size: 0.8em; }
        /* Hakikisha hii ipo kwenye watermark yako */
.chat-container::before {
    /* ... nyinginezo ... */
    pointer-events: none; /* Hii inafanya watermark ipitishwe na mibofyo */
    z-index: 0;
}

/* Ongeza hii kwa ajili ya input box */
.input-container {
    position: fixed;
    bottom: 0;
    width: 100%;
    z-index: 1000; /* Hii inahakikisha input inakaa juu ya kila kitu */
}
    </style>
</head>
<body>

        <input type="text" id="admin-message" placeholder="Write text..." style="width: 100%;">
        <input type="file" id="image-input" accept="image/*" style="display:none">
       
        <button id="send-btn">Send</button>
       
        
        
    </div>
</div>

<div class="chat-container" id="Charts"></div>

    messageElement.textContent = msg.text;
   
    chatContainer.appendChild(messageElement);
    // Auto-scroll kwenda chini
    chatContainer.scrollTop = chatContainer.scrollHeight;

}

</body>
</html>
