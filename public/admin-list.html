        async function loadAdminList() {
            const listContainer = document.getElementById("admin-client-list");
            try {
                // Tunasoma kutoka "Charts" kama ilivyo kwenye database yako
                const querySnapshot = await getDocs(collection(db, "Legal-request"));

                    const card = document.createElement("div");
                    card.className = "client-card";
                   
                    card.innerHTML = `
                        <h3>${data.jina || 'Mteja Asiyejulikana'}</h3>
                        <p>Simu: ${data.simu || 'N/A'}</p>
                        <p>Miaka: ${data.miaka || 'N/A'}</p>

                        <p>hadhi: ${data.hadhi || 'N/A'}</p>
                        <p>Asili ya tatizo: ${data.mkataba || 'N/A'}</p>
                        <p>Tatizo: ${data.maelezo || 'N/A'}</p>
                        <p>Time: ${data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A'}</p>
                        <button class="chat-btn" data-chatid="${data.chatId}">Ingia Chat</button>
                      
                    `;
                    listContainer.appendChild(card);
                });
            } catch (error) {
                listContainer.innerHTML = "Imeshindikana kupakia wateja: " + error.message;
            }
        }
