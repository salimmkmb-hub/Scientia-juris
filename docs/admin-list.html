<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Scientia Juris</title>
    <style>
        body { font-family: 'Times New Roman', 'Times New Roman', Times, serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        h2 { color: #2c3e50; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; table-layout: fixed;}
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #007bff; color: white; font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        .btn { padding: 8px 16px; cursor: pointer; border: none; color: white; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-jibu { background-color: #28a745; }
        .btn-jibu:hover { background-color: #218838; }
        .status-bado { background-color: #f8d7da; color: #721c24; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-tayari { background-color: #d4edda; color: #155724; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
       
        /* Modal ya Kujibia */
        #replyModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 10px 25px rgba(0,0,0,0.2); width: 400px; z-index: 1000; }
        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        textarea { width: 100%; height: 120px; margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Legal Service Request List (Admin Panel)</h2>
   
    <table>
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Age</th>
                <th>Phone</th>
                <th>Email-address</th>
                <th>Nature of legal-problem</th>
                <th>Types of service</th>
                <th>Resident</th>
                <th>Marriage status</th>
                <th>Request status</th>
                <th>Complete</th>
            </tr>
        </thead>
        <tbody id="maombi-table-body">
            </tbody>
    </table>

    <div id="modalOverlay" onclick="fungaModal()"></div>
    <div id="replyModal">
        <h3>Jibu Ombi</h3>
        <p><strong>Kwa:</strong> <span id="modal-email"></span></p>
        <textarea id="reply-text" placeholder="Andika barua pepe ya jibu hapa..."></textarea>
        <div class="modal-buttons">
            <button class="btn" style="background:#dc3545;" onclick="fungaModal()">Ghairi</button>
            <button class="btn btn-jibu" onclick="tumaJibu()">Tuma Jibu (Email)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // WEKA CONFIGURATION ZAKO HAPA
        const firebaseConfig = {
             apiKey: "AIzaSyBp0aLe1gbiI0kSf5eGukKo6f2_4Y3uNCc",
            authDomain: "scientia-juris.firebaseapp.com",
            projectId: "scientia-juris",
            storageBucket: "scientia-juris.firebasestorage.app",
            messagingSenderId: "477823870765",
            appId: "1:477823870765:web:9e7d1f99cc5e1db07655a4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let sasaHiviOmbiId = "";
        let sasaHiviEmail = "";
        let sasaHiviJina = "";

        // 1. Kusoma Maombi Realtime kutoka Firestore
        const q = query(collection(db, "Contract-request"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const tableBody = document.getElementById("maombi-table-body");
            tableBody.innerHTML = "";

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><b>${data.jina}</b></td>
                    <td>${data.miaka}</td>
                    <td>${data.simu}</td>
                    <td>${data.email-address}</td>
                    <td>${data.mkataba}</td>
                    <td>${data.service}</td>
                    <td>${data.makazi}</td>
                    <td>${data.hadhi}</td>
                    <td>${data.ujumbe}</td>
                    <td>
                        <span class="${data.status === 'bado' ? 'status-bado' : 'status-tayari'}">
                            ${data.Request-status === 'bado' ? 'BADO' : 'IMEJIBIWA'}
                        </span>
                    </td>
                    <td>
                        ${data.status === 'bado' ? `<button class="btn btn-jibu" onclick="funguaModal('${id}', '${data.email}', '${data.jina}')">Jibu</button>` : '✔️ Ushajibu'}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        });

        // 2. Kufungua na Kufunga Modal
        window.funguaModal = function(id, email, jina) {
            sasaHiviOmbiId = id;
            sasaHiviEmail = email;
            sasaHiviJina = jina;
            document.getElementById("modal-email").innerText = email;
            document.getElementById("replyModal").style.display = "block";
            document.getElementById("modalOverlay").style.display = "block";
        }

        window.fungaModal = function() {
            document.getElementById("replyModal").style.display = "none";
            document.getElementById("modalOverlay").style.display = "none";
            document.getElementById("reply-text").value = "";
        }

        // 3. Kubadili Status na Kutengeneza Document ya Email
        window.tumaJibu = async function() {
            const jibuUjumbe = document.getElementById("reply-text").value;
            if(!jibuUjumbe) return alert("Tafadhali andika jibu kwanza!");

            try {
                // Hatua A: Badili hali ya ombi kuwa "imejibiwa"
                const docRef = doc(db, "Contract-request", sasaHiviOmbiId);
                await updateDoc(docRef, {
                    status: "imejibiwa"
                });

                // Hatua B: Rekodi barua pepe kwenye collection ya 'mail' (Hapa Trigger Email Extension itasoma na kutuma)
                await addDoc(collection(db, "mail"), {
                    to: sasaHiviEmail,
                    message: {
                        subject: "Jibu la Ombi Lako - Scientia Juris",
                        text: `Habari ${sasaHiviJina},\n\nAsante kwa kuwasiliana nasi. Hili ndilo jibu la ombi/swali lako:\n\n"${jibuUjumbe}"\n\nWako,\nAdmin - Scientia Juris`,
                        // Unaweza kuweka html pia kama unataka iwe ya kuvutia zaidi
                        html: `<p>Habari <b>${sasaHiviJina}</b>,</p><p>Asante kwa kuwasiliana nasi. Hili ndilo jibu la ombi/swali lako:</p><blockquote style="border-left:5px solid #007bff; padding-left:10px; font-style:italic;">${jibuUjumbe}</blockquote><p>Wako,<br><b>Admin - Scientia Juris</b></p>`
                    }
                });

                alert("Jibu limeshakuwa logiwa! Extension ikishakuwa active, email itatumwa sasa hivi.");
                fungaModal();
            } catch (error) {
                console.error("Kuna shida imetokea: ", error);
                alert("Imeshindikana kutuma jibu. Angalia console.");
            }
        }
    </script>
</body>
</html>
