<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request service</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-xl bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
        <!-- Mapambo ya Mwanga wa Nyuma (Glow Effect) -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl"></div>

        <!-- Kichwa cha Form -->
        <div class="text-center mb-8 relative z-10">
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center mx-auto mb-4 border border-indigo-500/20">
                <span class="material-symbols-outlined">rate_review</span>
            </div>
            <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Tutumie Ujumbe Wako</h2>
            <p class="text-sm text-slate-400 mt-2">Jaza fomu hii, tutakupokea na kukujibu haraka iwezekanavyo.</p>
        </div>

        <!-- FORM YENYEWE -->
        <form id="contact-form" onsubmit="handleSubmit(event)" class="space-y-5 relative z-10">
           <!-- Kichwa cha Form chenye Nembo Halisi ya Scientia Juris -->
          <div class="text-center mb-8 relative z-10">
          <!-- Nembo Yako Halisi -->
          <img src="background.jpg" alt="Scientia Juris Logo" class="h-28 w-auto mx-auto mb-4 object-contain drop-shadow-[0_0_20px_rgba(99,102,241,0.15)]">
   
          <!-- Maelezo ya Chini ya Fomu -->
           <p class="text-xs text-indigo-400 font-semibold uppercase tracking-widest">Public Legal Education & Consultation</p>
         </div>
            <!-- Jina la Mteja -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Jina Lako Kamili</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-500 text-xl">person</span>
                    <input type="text" id="user-name" required placeholder="Mfano: Festo John"
                           class="w-full bg-slate-900/50 border border-slate-800 focus:border-indigo-500 focus:bg-slate-900 focus:outline-none rounded-xl pl-12 pr-4 py-3 text-sm text-white transition">
                </div>
            </div>

            <!-- Email ya Mteja -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Barua Pepe (Email)</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-500 text-xl">mail</span>
                    <input type="email" id="user-email" required placeholder="festo@example.com"
                           class="w-full bg-slate-900/50 border border-slate-800 focus:border-indigo-500 focus:bg-slate-900 focus:outline-none rounded-xl pl-12 pr-4 py-3 text-sm text-white transition">
                </div>
            </div>

            <!-- Ujumbe Wenyewe -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Ujumbe Wako</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-500 text-xl">chat_bubble</span>
                    <textarea id="user-message" required rows="4" placeholder="Andika unachotaka kutuambia au kuuliza hapa..."
                              class="w-full bg-slate-900/50 border border-slate-800 focus:border-indigo-500 focus:bg-slate-900 focus:outline-none rounded-xl pl-12 pr-4 py-3 text-sm text-white transition resize-none"></textarea>
                </div>
            </div>

            <!-- Button ya Kutuma -->
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl py-3.5 text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 cursor-pointer">
                <span>Tuma Ujumbe</span>
                <span class="material-symbols-outlined text-sm">send</span>
            </button>

            <!-- Ujumbe wa Hali (Success/Error) -->
            <p id="status-text" class="text-xs text-center font-medium mt-2 hidden"></p>
            <!-- Sehemu ya Ujumbe wa Hali (Success/Error Box) -->
            <div id="status-box" class="w-full border rounded-xl p-3 items-center gap-3 hidden transition-all duration-300">
            <span id="status-icon" class="material-symbols-outlined text-xl"></span>
           <span id="status-text" class="text-sm font-medium"></span>
           </div>
        </form>
    </div>

    <!-- SCRIPT ZA FIREBASE NA KUTUMA DATA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // 1. WEKA CONFIG YAKO YA FIREBASE HAPA
            const firebaseConfig = {
            apiKey: "AIzaSyBp0aLe1gbiI0kSf5eGukKo6f2_4Y3uNCc",
            authDomain: "scientia-juris.firebaseapp.com",
            projectId: "scientia-juris",
            storageBucket: "scientia-juris.firebasestorage.app",
            messagingSenderId: "477823870765",
            appId: "1:477823870765:web:9e7d1f99cc5e1db07655a4",
             measurementId: "G-KPKNNCCH6W"
             };
    
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            // 2. WEKA PUBLIC KEY YAKO YA EMAILJS HAPA
            emailjs.init("PwQa29hKMWTuibIIh");

    
             window.handleSubmit = async function(e) {
    e.preventDefault(); // 1. LAZIMA: Inazuia page kurefresh!

    const btn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');

    // Chukua data kutoka kwenye Form Inputs
    const formElement = e.target; // fomu yenyewe
    const name = document.getElementById('user-name') ? document.getElementById('user-name').value : '';
    const email = document.getElementById('user-email') ? document.getElementById('user-email').value : '';
    const message = document.getElementById('user-message') ? document.getElementById('user-message').value : '';

    // Badilisha muonekano wa button
    btn.disabled = true;
    btn.innerHTML = '<span>Inatuma...</span>';

    try {
        // 2. HIFADHI TAARIFA FIREBASE
        await addDoc(collection(db, "Legal-Consultation"), {
            name: name,
            email: email,
            message: message,
            timestamp: serverTimestamp()
        });

        const templateParams = {
            to_email: email,
            from_name: name,
            from_email: email,
            message: message
        };

        // 3. TUMA EMAIL KUPITIA EMAILJS
        await emailjs.send(
            'service_6mdpboh',
            'template_6qr0qnt',
            templateParams, 
            'PwQa29hKMWTuibIIh'
        );

        // MAOMBI YAKIKUBALIWA
        statusBox.className = "w-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 p-3 rounded-lg flex items-center gap-2";
        statusIcon.innerText = "check_circle";
        statusText.innerText = "Feedback submitted successfully!";
       
        // Safisha fomu
        formElement.reset();
        

    } catch (error) {
        // MAOMBI YAKIFELI
        console.error("Shida imetokea: ", error);
        statusBox.className = "w-full bg-rose-500/10 border border-rose-500/30 text-rose-400 p-3 rounded-lg flex items-center gap-2";
        statusIcon.innerText = "error";
        statusText.innerText = "Kuna shida imetokea: " + error.message;
        statusBox.classList.remove('hidden');
    } finally {
        // Rudisha button kuwa ya kawaida
        btn.disabled = false;
        btn.innerHTML = '<span>Tuma Ujumbe</span>';
    }
};

        // Listener ya kuficha status-box pale mteja anapoanza kuandika tena
     ['user-name', 'user-email', 'user-message'].forEach(id => {
    const inputElement = document.getElementById(id);
    if (inputElement) {
        inputElement.addEventListener('input', () => {
            const statusBox = document.getElementById('status-box');
            if (statusBox) {
                statusBox.classList.add('hidden'); // Inajificha tena Mteja akianza kuandika
            }
        });
    }
});

    </script>
</body>
</html>
