<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientia Juris - Omba Huduma</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .fomu-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            border-top: 5px solid #1ea099; /* Rangi yako kuu ya kisheria */
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.maelezo {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .Kikundi-cha-fomu {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #1ea099;
            background-color: #fff;
        }

        /* Box la huduma inayochaguliwa kiotomatiki */
        .huduma-iliyoteuliwa {
            background-color: #e8f6f5;
            color: #157a75;
            font-weight: bold;
            border: 1px dashed #1ea099;
        }

        .btn-tuma {
            background-color: #1ea099;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-tuma:hover {
            background-color: #157a75;
        }

        .btn-rudi {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
       
        .btn-rudi:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="fomu-container">
        <h2>Wasilisha Taarifa Zako</h2>
        <p class="maelezo">Tafadhali jaza fomu hii ili tuweze kuanza kushughulikia ombi lako.</p>

        <form id="legalForm" onsubmit="kamilishaTuma(event)">
           
            <div class="Kikundi-cha-fomu">
                <label>Huduma Uliyochagua</label>
                <input type="text" id="hudumaInput" class="huduma-iliyoteuliwa" readonly>
            </div>

            <div class="Kikundi-cha-fomu">
                <label for="jina">Jina Lako Kamili</label>
                <input type="text" id="jina" placeholder="Mfano: John Doe" required>
            </div>

            <div class="Kikundi-cha-fomu">
                <label for="simu">Namba ya Simu</label>
                <input type="tel" id="simu" placeholder="Mfano: 0712345678" required>
            </div>

            <div class="Kikundi-cha-fomu">
                <label for="pepe">Barua Pepe (Email)</label>
                <input type="email" id="pepe" placeholder="Mfano: john@example.com" required>
            </div>

            <div class="Kikundi-cha-fomu">
                <label for="maelezo">Maelezo ya Ziada (Hiari)</label>
                <textarea id="maelezo" rows="4" placeholder="Andika maelezo mafupi kuhusu hitaji lako..."></textarea>
            </div>

            <button type="submit" class="btn-tuma">Tuma Maombi</button>
            <a href="javascript:history.back()" class="btn-rudi">← Rudi Kwenye Huduma</a>
        </form>
    </div>

    <script>
        // Code ya kuchukua jina la huduma kutoka kwenye URL na kuliweka kwenye fomu
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const jinaLaHuduma = urlParams.get('huduma');
            if (jinaLaHuduma) {
                document.getElementById('hudumaInput').value = jinaLaHuduma;
            } else {
                document.getElementById('hudumaInput').value = "Huduma ya Kisheria";
            }
        };

        function kamilishaTuma(event) {
            event.preventDefault();
            const jina = document.getElementById('jina').value;
            const huduma = document.getElementById('hudumaInput').value;
           
            alert('Asante ' + jina + '!\nMaombi yako ya huduma ya "' + huduma + '" yamepokelewa rasmi.');
            // Hapa mbeleni unaweza kuweka code za kutuma hizi data kwenda Firebase au Email
        }
    </script>

</body>
</html>
