<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientia Juris - Maelezo ya Huduma</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
<div class="form-container" style="padding: 20px; max-width: 500px; margin: auto; font-family:'Times New Roman', Times, serif;">
    <h3>Request for Drafting of Article of Association</h3>
    <p>Please fill the information below:</p>

    <form id="legalForm">
        <strong><label for="fname">Registered Name:</label></strong><br>
        <input type="text" id="fname" name="fname" placeholder="" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="miaka">Nature of Company/Institution:</label></strong><br>
        <input type="text" id="miaka" name="miaka" placeholder="Eg; Public or Private" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="makazi">Resident and Location Address:</label></strong><br>
        <input type="text" id="makazi" name="makazi" placeholder="" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="hadhi">Domicile of Company/ Institution:</label></strong><br>
        <input type="text" id="hadhi" name="hadhi" placeholder="" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="phone">Name of the Applicant:</label></strong><br>
        <input type="tel" id="phone" name="phone" placeholder="Eg: John Doe" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="phone">Position of the Applicant:</label></strong><br>
        <input type="tel" id="phone" name="phone" placeholder="Eg: Manager, Director" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"><br>

        <strong><label for="details">Maelezo ya ziada/More information:</label></strong><br>
        <textarea id="details" name="details" rows="4" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px;"></textarea><br>

        <button type="submit" style="background-color: teal; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;">
            Tuma Maombi/Send
        </button>
    </form>
    <br>

    <script type="module" src="form.js">
    // Import the Firebase functions you need from the CDNs
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Your web app's Firebase configuration (Copy this from your Firebase Console)
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Get the form element
const form = document.getElementById('serviceForm');

// Listen for the form submission
form.addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevent page from reloading automatically

    // Get values from the input fields
    const fullName = document.getElementById('fullName').value;
    const phoneNumber = document.getElementById('phoneNumber').value;
    const serviceType = document.getElementById('serviceType').value;
    const details = document.getElementById('details').value;

    try {
        // Add a new document to the "serviceRequests" collection in Firestore
        const docRef = await addDoc(collection(db, "serviceRequests"), {
            clientName: fullName,
            phone: phoneNumber,
            service: serviceType,
            description: details,
            timestamp: new Date() // Saves the exact time it was sent
        });

        alert("Taarifa zako zimetumwa kikamilifu! Tutakuwasiliana hivi karibuni.");
        form.reset(); // Clear the form fields
       
        // Optional: Redirect back to home page after submission
        window.location.href = "index.html";

    } catch (error) {
        console.error("Error adding document: ", error);
        alert("Kuna tatizo limetokea wakati wa kutuma taarifa. Tafadhali jaribu tena.");
    }
});
</script>
</body>
</html>
