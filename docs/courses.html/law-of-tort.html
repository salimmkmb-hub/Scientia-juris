<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientia Juris</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Georgia", "Times New Roman", Garamond, serif;
      font-size: 19px;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #ffffff;
    }

    /* Top Navigation Header */
    header {
      background-color: #002b49; /* Bluu ya juu */
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 6px solid #008ca8; /* Mstari wa Cyan/Teal */
    }

    /* Muundo wa Nembo (Logo) */
    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo-container img {
      height: 45px; /* Unaweza kubadilisha urefu wa nembo hapa */
      width: auto;  /* Inahifadhi umbo la nembo lisiharibike */
    }

    /* Ikoni za Kulia (Search & Menu) */
    .header-icons {
      display: flex;
      gap: 20px;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: 35px auto;
      padding: 0 20px;
    }

    p {
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <!-- Header yenye Nembo ya Scientia Juris -->
  <header>
    <div class="logo-container">
      <!-- Badilisha "logo.png" kuweka jina au njia (path) ya picha yako ya nembo -->
      <img src="background.jpg" alt="Scientia Juris Logo">
    </div>

    <div class="header-icons">
      <span>🔍</span>
      <span>☰</span>
    </div>
  </header>

  <!-- Content -->
  <div class="container">
    <p>
      Karibu kwenye mfumo wa Scientia Juris...
    </p>
  </div>

</body>
</html>
